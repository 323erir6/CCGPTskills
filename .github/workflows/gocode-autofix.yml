name: GOCODE safe formatter PR (manual)

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  autofix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Install formatter
        run: python3 -m pip install ruff
      - name: Apply only deterministic Python fixes
        run: |
          ruff check agent --fix --select F401,I001 --unsafe-fixes=false || true
          ruff format agent
      - name: Submit a pull request when files changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo 'No deterministic formatting changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          BRANCH="gocode/autofix-${GITHUB_RUN_ID}"
          git checkout -b "$BRANCH"
          git add agent
          git commit -m 'style: apply deterministic GOCODE Python fixes'
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title 'GOCODE: deterministic Python formatting' \
            --body 'Automated formatting only. Requires human or agent diff review; no automatic merge.'
