# EN: Adjust APP_ENTRY and APP_NAME before installing this Windows build workflow.
# RU: Изменить APP_ENTRY и APP_NAME перед использованием.
name: Build Windows executable
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      APP_ENTRY: src/main.py
      APP_NAME: Application
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        shell: pwsh
        run: |
          if (Test-Path requirements.txt) { python -m pip install -r requirements.txt }
          python -m pip install pyinstaller
      - name: Build EXE
        run: python -m PyInstaller --noconfirm --onefile --name "$env:APP_NAME" "$env:APP_ENTRY"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/*.exe
          retention-days: 14
